<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 18 - Built-in Form Validation</title>
</head>
<body>

  <div>
    <h2>Create Account</h2>
    
    <form action="#" method="POST">
      
      <!-- 1. Username: Required + Length constraints -->
      <div>
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="e.g. JohnDoe" 
          required 
          minlength="3" 
          maxlength="15"
        >
      </div>

      <!-- 2. Email: Required + Built-in format check -->
      <div>
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="e.g. john@example.com" 
          required
        >
      </div>

      <!-- 3. Password: Required + Pattern (Regex rule: min 8 chars, 1 letter, 1 number) -->
      <div>
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="At least 8 characters" 
          required 
          minlength="8"
          pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"
          title="Password must be at least 8 characters long and contain both letters and numbers."
        >
      </div>

      <!-- 4. Age: Required + Numeric bounds -->
      <div>
        <label for="age">Age</label>
        <input 
          type="number" 
          id="age" 
          name="age" 
          placeholder="18 - 99" 
          required 
          min="18" 
          max="99"
        >
      </div>

      <button type="submit">Register</button>
    </form>
  </div>

</body>
</html>

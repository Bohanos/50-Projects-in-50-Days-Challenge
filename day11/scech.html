<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="color.css">
</head>

<body>
    <main class="card">
        <form class="search" id="searchForm" role="search">
            <input id="cityInput" type="search" placeholder="Enter city name" spellcheck="false" value="Lagos" aria-label="City name">
            <button id="searchBtn" type="submit" aria-label="Search weather">
                <img src="srch.png" alt="Search icon">
            </button>
        </form>

        <p id="statusMessage" class="error-message" role="status" aria-live="polite" aria-atomic="true">Loading weather...</p>

        <section class="weather" id="weatherBox" aria-label="Current weather" hidden>
            <img id="weatherIcon" src="weather.png" class="weather-icon" alt="Weather icon">
            <h1 class="temp"></h1>
            <h2 class="city"></h2>

            <div class="info-grid">
                <div class="details">
                    <div class="col">
                        <img src="wind_icon_240997.png" alt="Humidity icon">
                        <div>
                            <p class="humidity"></p>
                            <p>Humidity</p>
                        </div>
                    </div>
                </div>

                <div class="details">
                    <div class="col">
                        <img src="wind_weather_icon_246026.png" alt="Wind icon">
                        <div>
                            <p class="wind"></p>
                            <p>Wind Speed</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const searchForm = document.getElementById('searchForm');
        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const statusMessage = document.getElementById('statusMessage');
        const weatherBox = document.getElementById('weatherBox');
        const weatherIcon = document.getElementById('weatherIcon');
        const tempEl = document.querySelector('.temp');
        const cityEl = document.querySelector('.city');
        const humidityEl = document.querySelector('.humidity');
        const windEl = document.querySelector('.wind');
        let latestRequest = 0;

        const weatherIcons = {
            clear: 'sunny_weather_icon_150663 (1).png',
            cloudy: 'weather_43796.png',
            rain: '2998141-cloud-nature-rain-weather_99845.png',
            storm: 'if-weather-3-2682848_90785.png',
            default: 'weather.png'
        };

        function getWeatherIcon(code) {
            if (code === 0) return weatherIcons.clear;
            if ([1, 2, 3].includes(code)) return weatherIcons.cloudy;
            if ([45, 48].includes(code)) return weatherIcons.cloudy;
            if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return weatherIcons.rain;
            if ([71, 73, 75, 77, 85, 86].includes(code)) return weatherIcons.cloudy;
            if ([95, 96, 99].includes(code)) return weatherIcons.storm;
            return weatherIcons.default;
        }

        function getWeatherDescription(code) {
            const map = {
                0: 'Clear sky',
                1: 'Mostly clear',
                2: 'Partly cloudy',
                3: 'Cloudy',
                45: 'Foggy',
                48: 'Foggy',
                51: 'Light drizzle',
                53: 'Drizzle',
                55: 'Heavy drizzle',
                56: 'Freezing drizzle',
                57: 'Freezing drizzle',
                61: 'Light rain',
                63: 'Rain',
                65: 'Heavy rain',
                66: 'Freezing rain',
                67: 'Heavy freezing rain',
                71: 'Light snow',
                73: 'Snow',
                75: 'Heavy snow',
                77: 'Snow grains',
                80: 'Rain showers',
                81: 'Heavy showers',
                82: 'Violent showers',
                85: 'Snow showers',
                86: 'Heavy snow showers',
                95: 'Thunderstorm',
                96: 'Thunderstorm with hail',
                99: 'Severe thunderstorm'
            };
            return map[code] || 'Weather update';
        }

        async function fetchJson(url) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Weather service request failed (${response.status}). Please try again.`);
            }
            return response.json();
        }

        async function searchWeather() {
            const requestId = ++latestRequest;
            const city = cityInput.value.trim();
            if (!city) {
                weatherBox.hidden = true;
                statusMessage.textContent = 'Please enter a city name.';
                searchBtn.disabled = false;
                return;
            }

            weatherBox.hidden = true;
            statusMessage.textContent = 'Loading weather...';
            searchBtn.disabled = true;

            try {
                const geoData = await fetchJson(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
                if (requestId !== latestRequest) return;

                if (!geoData.results || geoData.results.length === 0) {
                    statusMessage.textContent = 'City not found. Check the spelling and try again.';
                    return;
                }

                const { latitude, longitude, name, country } = geoData.results[0];
                const weatherData = await fetchJson(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`);
                if (requestId !== latestRequest) return;

                const current = weatherData.current;
                if (
                    !current ||
                    !Number.isFinite(current.temperature_2m) ||
                    !Number.isFinite(current.relative_humidity_2m) ||
                    !Number.isFinite(current.wind_speed_10m) ||
                    !Number.isFinite(current.weather_code)
                ) {
                    throw new Error('Weather service returned incomplete weather data. Please try again.');
                }

                const description = getWeatherDescription(current.weather_code);
                const iconFile = getWeatherIcon(current.weather_code);

                tempEl.textContent = `${Math.round(current.temperature_2m)}°C`;
                cityEl.textContent = country ? `${name}, ${country}` : name;
                humidityEl.textContent = `${current.relative_humidity_2m}%`;
                windEl.textContent = `${Math.round(current.wind_speed_10m)} km/h`;
                weatherIcon.src = iconFile;
                weatherIcon.alt = description;
                weatherIcon.title = description;
                weatherBox.hidden = false;
                statusMessage.textContent = '';
            } catch (error) {
                if (requestId !== latestRequest) return;

                console.error('Weather lookup failed.', error);
                if (error instanceof TypeError) {
                    statusMessage.textContent = 'Could not connect to the weather service. Check your connection and try again.';
                } else if (error instanceof SyntaxError) {
                    statusMessage.textContent = 'The weather service returned unreadable data. Please try again.';
                } else {
                    statusMessage.textContent = error instanceof Error
                        ? error.message
                        : 'Could not fetch weather data. Please try again.';
                }
            } finally {
                if (requestId === latestRequest) {
                    searchBtn.disabled = false;
                }
            }
        }

        searchForm.addEventListener('submit', (event) => {
            event.preventDefault();
            searchWeather();
        });

        searchWeather();
    </script>
</body>

</html>

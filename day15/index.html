<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BMI Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <!-- header  -->
            <h1>BMI Calculator</h1>

            <!-- form  -->
            <div class="form">
                <form action="">
                    <label for="weight">Weight in kg</label>
                    <input type="number" placeholder="Enter your weight..." id="weight" required min="7"><br>

                    <label for="height">Height in meters</label>
                    <input type="number" placeholder="Enter your height..." id="height" required min="0.5" step="0.01">

                    <button class="btn">Check my BMI</button>
                </form>
            </div>

            <!-- Output area  -->
            <div class="result-container">
                <h2>Result</h2>
                <p id="result">Result: </p>
                <p class="status">Status: </p>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Stop Watch</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <head>
            <h1>Stop Watch</h1>
        </head>

        <section class="stopwatch-display">
            <span id="decades">00 <br><a href="#">Decades</a></span>:
            <span id="years">00 <br><a href="#">Years</a></span>:
            <span id="days">00 <br><a href="#">Days</a></span>:
            <span id="hours">00 <br><a href="#">Hours</a></span>:
            <span id="minutes">00 <br><a href="#">Minutes</a></span>:
            <span id="seconds">00 <br><a href="#">Seconds</a></span>:
            <span id="milliseconds">00 <br><a href="#">Milliseconds</a></span>
        </section>

        <section class="buttons">
            <button id="start">Start</button>
            <button id="stop">Stop</button>
            <button id="reset">Reset</button>
        </section>

        <script src="script.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-container">
        <h2>My To-Do List</h2>

        <form class="input-row" id="taskForm">
            <label class="visually-hidden" for="taskInput">Add a task</label>
            <input type="text" id="taskInput" placeholder="Add a task..." autocomplete="off" />
            <button id="addBtn" type="submit">Add</button>
        </form>

        <ul id="todoList"></ul>
        <p id="storageMessage" role="status" aria-live="polite"></p>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const taskForm = document.getElementById('taskForm');
        const todoList = document.getElementById('todoList');
        const storageMessage = document.getElementById('storageMessage');
        const storageKey = 'tasks';

        function loadTasks() {
            try {
                const savedTasks = localStorage.getItem(storageKey);
                const parsedTasks = savedTasks ? JSON.parse(savedTasks) : [];

                if (!Array.isArray(parsedTasks)) {
                    throw new Error('Saved task data has an invalid format.');
                }

                const validTasks = parsedTasks.filter((task) =>
                    task &&
                    typeof task.text === 'string' &&
                    typeof task.completed === 'boolean'
                );

                if (validTasks.length !== parsedTasks.length) {
                    storageMessage.textContent = 'Some saved tasks were invalid and could not be displayed.';
                }

                return validTasks;
            } catch (error) {
                console.error('Could not load saved tasks.', error);
                storageMessage.textContent = 'Saved tasks could not be loaded. Your new tasks can still be used in this session.';
                return [];
            }
        }

        let tasks = loadTasks();

        function renderTasks() {
            todoList.innerHTML = '';

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = task.completed ? 'completed' : '';

                const text = document.createElement('button');
                text.className = 'task-text';
                text.type = 'button';
                text.textContent = task.text;
                text.setAttribute('aria-pressed', String(task.completed));
                text.setAttribute('aria-label', `${task.completed ? 'Mark as incomplete' : 'Complete'}: ${task.text}`);

                text.addEventListener('click', () => {
                    tasks[index].completed = !tasks[index].completed;
                    saveTasks();
                    renderTasks();
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';

                deleteBtn.addEventListener('click', () => {
                    tasks.splice(index, 1);
                    saveTasks();
                    renderTasks();
                });

                li.appendChild(text);
                li.appendChild(deleteBtn);
                todoList.appendChild(li);
            });
        }

        function saveTasks() {
            try {
                localStorage.setItem(storageKey, JSON.stringify(tasks));
                storageMessage.textContent = '';
            } catch (error) {
                console.error('Could not save tasks.', error);
                storageMessage.textContent = 'Your changes could not be saved in this browser.';
            }
        }

        taskForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const value = taskInput.value.trim();
            if (value) {
                tasks.push({ text: value, completed: false });
                taskInput.value = '';
                saveTasks();
                renderTasks();
                taskInput.focus();
            }
        });

        renderTasks();
    </script>
</body>

</html>
